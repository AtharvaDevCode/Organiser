<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Koblenz Mail Inbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Newsreader', serif;
            background-color: #1d2021;
            color: #ebdbb2;
            -webkit-tap-highlight-color: transparent;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .sans-ui { font-family: 'JetBrains Mono', monospace; }
        
        .mobile-card {
            background-color: #282828;
            border: 1px solid #3c3836;
            transition: transform 0.15s ease, background-color 0.15s ease;
        }
        .mobile-card:active {
            transform: scale(0.98);
        }
        .pinned-card {
            border-color: #d79921 !important;
            background-color: #322d26 !important;
        }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #1d2021; }
        ::-webkit-scrollbar-thumb { background: #3c3836; border-radius: 2px; }

        input[type="search"] {
            background-color: #1d2021 !important;
            color: #ebdbb2 !important;
            border-color: #3c3836 !important;
        }
    </style>
</head>
<body class="pb-28 pt-4 px-3 md:p-8 min-h-screen flex flex-col justify-between">

    <div class="max-w-2xl mx-auto w-full">
        <!-- Top App Bar -->
        <header class="flex justify-between items-center border-b border-[#3c3836] pb-4 mb-4">
            <div>
                <h1 class="text-lg font-medium tracking-tight text-[#fbf1c7] flex items-center gap-2">
                    <span class="w-2 h-2 bg-[#d79921] rounded-full animate-pulse"></span>
                    Uni Koblenz // Inbox
                </h1>
                <p id="stats-counter" class="text-[11px] text-[#a89984] mt-0.5 mono">Loading records...</p>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="triggerSync()" class="bg-[#3c3836] active:bg-[#504945] text-[#ebdbb2] px-3 py-2 rounded-xl text-xs font-semibold border border-[#504945] transition">
                    Sync
                </button>
                <button onclick="toggleSelectMode()" id="select-mode-btn" class="bg-[#3c3836] active:bg-[#504945] text-[#ebdbb2] px-3 py-2 rounded-xl text-xs font-semibold border border-[#504945] transition">
                    Select
                </button>
            </div>
        </header>

        <!-- Search & Filter Bar -->
        <div class="mb-4 flex flex-col gap-2.5 sans-ui">
            <div class="relative">
                <input type="search" id="search-input" oninput="renderEvents()" placeholder="Search events, exams, deadlines..." class="w-full bg-[#1d2021] text-[#ebdbb2] border border-[#3c3836] px-4 py-3 rounded-2xl text-xs italic focus:outline-none focus:border-[#d79921] transition shadow-inner">
            </div>
            
            <!-- Filter controls wrapping nicely to prevent Android clipping -->
            <div class="flex flex-wrap items-center gap-2">
                <div class="flex gap-1 bg-[#282828] p-1 rounded-xl border border-[#3c3836] shrink-0">
                    <button onclick="setTab('active')" id="tab-active" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-[#d79921] text-[#1d2021] transition">Active</button>
                    <button onclick="setTab('upcoming')" id="tab-upcoming" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-[#a89984] transition">Upcoming</button>
                    <button onclick="setTab('done')" id="tab-done" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-[#a89984] transition">Done</button>
                    <button onclick="setTab('all')" id="tab-all" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-[#a89984] transition">All</button>
                </div>
                <select id="tag-filter" onchange="renderEvents()" class="bg-[#282828] text-[#ebdbb2] border border-[#3c3836] px-3 py-2 rounded-xl text-xs sans-ui flex-grow min-w-[120px] focus:outline-none">
                    <option value="" selected>All Tags</option>
                </select>
            </div>
        </div>

        <!-- Conversational Smart Feedback Bar -->
        <div id="ai-answer-bar" class="hidden mb-4 bg-[#23272e] border border-[#d79921]/30 px-4 py-2.5 rounded-xl text-xs sans-ui text-[#fabd2f] italic"></div>

        <div id="loading" class="text-center text-[#a89984] italic py-16 text-xs mono">Syncing database records...</div>
        
        <!-- Mobile Stream Feed -->
        <div id="events-list" class="flex flex-col gap-3.5"></div>
    </div>

    <!-- Floating Batch Action Toolbar (Appears when items are selected) -->
    <div id="batch-toolbar" class="hidden fixed bottom-6 left-4 right-4 max-w-md mx-auto bg-[#282828]/95 backdrop-blur border border-[#d79921]/50 px-5 py-3.5 rounded-2xl flex justify-between items-center text-xs sans-ui shadow-2xl z-50">
        <span id="selected-count" class="font-semibold text-[#fabd2f]">0 selected</span>
        <div class="flex gap-2">
            <button onclick="batchDelete()" class="bg-[#cc241d] text-white px-4 py-2 rounded-xl font-semibold transition">Delete Selected</button>
            <button onclick="toggleSelectMode()" class="bg-[#3c3836] text-[#ebdbb2] px-3 py-2 rounded-xl font-semibold transition">Cancel</button>
        </div>
    </div>

    <script>
        let allEvents = [];
        let currentTab = 'active';
        let selectMode = false;
        let selectedIds = new Set();

        function setTab(tab) {
            currentTab = tab;
            ['active', 'upcoming', 'done', 'all'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-[#d79921] text-[#1d2021] transition shadow";
                } else {
                    btn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-[#a89984] transition";
                }
            });
            renderEvents();
        }

        function toggleSelectMode() {
            selectMode = !selectMode;
            const btn = document.getElementById('select-mode-btn');
            if (selectMode) {
                btn.className = "bg-[#d79921] text-[#1d2021] px-3 py-2 rounded-xl text-xs font-semibold border border-[#d79921] transition";
                btn.innerText = "Done";
            } else {
                btn.className = "bg-[#3c3836] text-[#ebdbb2] px-3 py-2 rounded-xl text-xs font-semibold border border-[#504945] transition";
                btn.innerText = "Select";
                selectedIds.clear();
                document.getElementById('batch-toolbar').classList.add('hidden');
            }
            renderEvents();
        }

        function parseDate(dateStr) {
            if (!dateStr) return null;
            let rawDate = dateStr.split('-')[0].trim().split(' ')[0];
            let parts = rawDate.split('.');
            if (parts.length === 3) return new Date(parts[2], parts[1] - 1, parts[0]);
            return null;
        }

        function getDaysToGo(dateStr) {
            const eventDate = parseDate(dateStr);
            if (!eventDate) return { text: "", isPast: false };
            let today = new Date();
            today.setHours(0, 0, 0, 0);
            let diffDays = Math.ceil((eventDate - today) / (1000 * 60 * 60 * 24));
            if (diffDays > 0) return { text: `<span class="bg-[#fabd2f]/15 text-[#fabd2f] border border-[#fabd2f]/30 px-2 py-0.5 rounded text-[10px] mono font-semibold">in ${diffDays}d</span>`, isPast: false };
            if (diffDays === 0) return { text: `<span class="bg-[#fe8019]/20 text-[#fe8019] border border-[#fe8019]/40 px-2 py-0.5 rounded text-[10px] mono font-bold">Today</span>`, isPast: false };
            return { text: `<span class="bg-[#3c3836] text-[#a89984] px-2 py-0.5 rounded text-[10px] mono">Passed</span>`, isPast: true };
        }

        async function triggerSync() {
            const btn = event.target;
            btn.innerText = "...";
            try {
                await fetch('/sync', { method: 'POST' });
                alert("Background sync triggered.");
            } catch (e) { alert("Sync failed."); }
            finally { btn.innerText = "Sync"; }
        }

        async function toggleDone(id, isDone) {
            await fetch(`/events/${id}/done`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_done: isDone })
            });
            fetchEvents();
        }

        async function togglePin(id, isPinned) {
            await fetch(`/events/${id}/pin`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_pinned: isPinned })
            });
            fetchEvents();
        }

        async function addTag(id, currentTagsStr) {
            let tagInput = prompt("Enter tag name (e.g., done, important, exam):");
            if (!tagInput) return;
            let tags = [];
            try { tags = JSON.parse(currentTagsStr.replace(/'/g, '"')); } catch(e) { tags = []; }
            if (!tags.includes(tagInput)) tags.push(tagInput);

            let extraUpdates = {};
            if (tagInput.toLowerCase().startsWith("done:")) extraUpdates.is_done = true;

            await fetch(`/events/${id}/tags`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tags: tags, ...extraUpdates })
            });
            fetchEvents();
        }

        function toggleSelect(id, checkbox) {
            if (checkbox.checked) selectedIds.add(id);
            else selectedIds.delete(id);
            
            const toolbar = document.getElementById('batch-toolbar');
            if (selectedIds.size > 0) {
                toolbar.classList.remove('hidden');
                document.getElementById('selected-count').innerText = `${selectedIds.size} selected`;
            } else {
                toolbar.classList.add('hidden');
            }
        }

        async function batchDelete() {
            if (!confirm(`Delete ${selectedIds.size} records?`)) return;
            await fetch('/events/batch-delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ids: Array.from(selectedIds) })
            });
            selectedIds.clear();
            document.getElementById('batch-toolbar').classList.add('hidden');
            fetchEvents();
        }

        async function fetchEvents() {
            try {
                const response = await fetch('/events');
                const data = await response.json();
                document.getElementById('loading').style.display = 'none';
                allEvents = data.events || [];
                populateTagDropdown();
                renderEvents();
            } catch (error) { document.getElementById('loading').innerText = "Failed to load database."; }
        }

        function populateTagDropdown() {
            const dropdown = document.getElementById('tag-filter');
            const currentSelected = dropdown.value;
            let allTagsSet = new Set();
            allEvents.forEach(ev => {
                try {
                    let tags = JSON.parse((ev.tags || '[]').replace(/'/g, '"'));
                    tags.forEach(t => allTagsSet.add(t));
                } catch(e){}
            });
            dropdown.innerHTML = `<option value="">All Tags</option>`;
            Array.from(allTagsSet).sort().forEach(tag => {
                let opt = document.createElement('option');
                opt.value = tag;
                opt.innerText = `#${tag}`;
                if (tag === currentSelected) opt.selected = true;
                dropdown.appendChild(opt);
            });
        }

        function renderEvents() {
            const listContainer = document.getElementById('events-list');
            listContainer.innerHTML = "";
            const rawSearchQuery = document.getElementById('search-input').value.trim().toLowerCase();
            const queryTokens = rawSearchQuery ? rawSearchQuery.split(/\s+/) : [];
            const selectedTag = document.getElementById('tag-filter').value;

            let filtered = allEvents.filter(ev => {
                const info = getDaysToGo(ev.date || ev.deadline);
                if (selectedTag) {
                    try {
                        let evTags = JSON.parse((ev.tags || '[]').replace(/'/g, '"'));
                        if (!evTags.includes(selectedTag)) return false;
                    } catch(e) { return false; }
                }

                let hasDoneTag = false;
                try {
                    let evTags = JSON.parse((ev.tags || '[]').replace(/'/g, '"'));
                    hasDoneTag = evTags.some(t => t.toLowerCase().startsWith('done'));
                } catch(e){}

                let effectiveIsDone = hasDoneTag ? true : ev.is_done;

                if (currentTab === 'done') return effectiveIsDone;
                if (effectiveIsDone) return false;
                if (currentTab === 'active') return !info.isPast;
                if (currentTab === 'upcoming') return !info.isPast;
                return true;
            });

            if (queryTokens.length > 0) {
                filtered = filtered.filter(ev => {
                    const text = `${ev.event_title} ${ev.summary} ${ev.organizer} ${ev.category}`.toLowerCase();
                    return queryTokens.every(token => text.includes(token));
                });
            }

            const aiBar = document.getElementById('ai-answer-bar');
            if (rawSearchQuery.length > 0) {
                aiBar.classList.remove('hidden');
                aiBar.innerText = `Found ${filtered.length} matching event${filtered.length > 1 ? 's' : ''}`;
            } else {
                aiBar.classList.add('hidden');
            }

            const uids = new Set(allEvents.map(e => e.email_uid).filter(Boolean));
            document.getElementById('stats-counter').innerText = `${filtered.length} items // ${uids.size || allEvents.length} parsed`;

            filtered.sort((a, b) => (a.is_pinned === b.is_pinned) ? 0 : a.is_pinned ? -1 : 1);

            if (filtered.length === 0) {
                listContainer.innerHTML = `<p class="text-[#a89984] italic py-16 text-center text-xs mono">No records found.</p>`;
                return;
            }

            filtered.forEach(event => {
                let hasDoneTag = false;
                try {
                    let evTags = JSON.parse((event.tags || '[]').replace(/'/g, '"'));
                    hasDoneTag = evTags.some(t => t.toLowerCase().startsWith('done'));
                } catch(e){}
                let effectiveIsDone = hasDoneTag ? true : event.is_done;

                const card = document.createElement('div');
                card.className = `mobile-card rounded-2xl p-4 flex flex-col gap-2.5 text-sm ${effectiveIsDone ? 'opacity-40' : ''} ${event.is_pinned ? 'pinned-card' : ''}`;

                let countdown = getDaysToGo(event.date || event.deadline);
                let dateDisplay = event.date ? `${event.date} ${countdown.text}` : (event.deadline ? `Deadline: ${event.deadline} ${countdown.text}` : 'No date specified');
                
                let checkboxHtml = selectMode ? `<input type="checkbox" onclick="toggleSelect(${event.id}, this)" ${selectedIds.has(event.id) ? 'checked' : ''} class="w-5 h-5 rounded bg-[#1d2021] border-[#504945] text-[#d79921]">` : '';

                let parsedTags = [];
                try { parsedTags = JSON.parse((event.tags || '[]').replace(/'/g, '"')); } catch(e) { parsedTags = []; }
                let tagsHtml = parsedTags.map(t => `<span class="bg-[#1d2021] text-[#d5c4a1] px-2 py-0.5 rounded text-[10px] border border-[#3c3836] mono">#${t}</span>`).join(' ');

                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2 sans-ui">
                        <div class="flex items-center gap-2">
                            ${checkboxHtml}
                            <span class="uppercase tracking-wider text-[10px] font-semibold text-[#bdae93] bg-[#d79921]/15 border border-[#d79921]/30 px-2 py-0.5 rounded">${event.category}</span>
                        </div>
                        <div class="flex items-center gap-1 text-xs">
                            <button onclick="togglePin(${event.id}, ${!event.is_pinned})" class="text-[#a89984] hover:text-[#fabd2f] px-2 py-1">${event.is_pinned ? '★' : '☆'}</button>
                        </div>
                    </div>

                    <div>
                        <h2 class="text-base font-medium text-[#fbf1c7] leading-snug italic mb-1">${event.event_title}</h2>
                        <p class="text-[11px] text-[#a89984] uppercase tracking-wide truncate sans-ui mb-2">${event.organizer || 'Unknown Sender'}</p>
                        <p class="text-[11px] font-semibold mono text-[#ebdbb2] bg-[#1d2021] p-2 rounded-xl border border-[#3c3836] mb-2 inline-block">${dateDisplay}</p>
                        <p class="text-[#d5c4a1] text-xs leading-relaxed not-italic">${event.summary}</p>
                    </div>

                    ${event.email_link ? `<div><a href="${event.email_link}" target="_blank" class="text-xs font-semibold text-[#83a598] underline underline-offset-4">Open Broadcast Link</a></div>` : ''}

                    <div class="pt-2 border-t border-[#3c3836] flex justify-between items-center sans-ui text-xs">
                        <div class="flex flex-wrap items-center gap-1">
                            ${tagsHtml}
                            <button onclick="addTag(${event.id}, '${event.tags || '[]'}')" class="text-[10px] text-[#a89984] bg-[#1d2021] px-2 py-0.5 rounded border border-[#3c3836]">+Tag</button>
                        </div>
                        <label class="flex items-center gap-1.5 cursor-pointer font-bold text-xs text-[#ebdbb2] py-1">
                            <input type="checkbox" ${effectiveIsDone ? 'checked' : ''} onchange="toggleDone(${event.id}, this.checked)" class="w-4 h-4 rounded bg-[#1d2021] border-[#504945] text-[#b8bb26]">
                            Done
                        </label>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        fetchEvents();
    </script>
</body>
</html>
