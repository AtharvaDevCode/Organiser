<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universität Koblenz // Inbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Newsreader', serif;
            background-color: #1d2021;
            color: #ebdbb2;
            -webkit-tap-highlight-color: transparent;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .sans-ui { font-family: 'JetBrains Mono', monospace; }
        
        .card {
            background-color: #282828;
            border: 1px solid #3c3836;
            transition: all 0.15s ease;
        }
        .pinned-card {
            border-color: #d79921 !important;
            background-color: #322d26 !important;
        }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #1d2021; }
        ::-webkit-scrollbar-thumb { background: #3c3836; border-radius: 2px; }

        input[type="search"], select {
            background-color: #1d2021 !important;
            color: #ebdbb2 !important;
            border-color: #3c3836 !important;
        }

        /* Responsive Design Switcher: Show Mobile View on small screens, PC View on desktop */
        @media (max-width: 768px) {
            .pc-view { display: none !important; }
            .mobile-view { display: flex !important; }
        }
        @media (min-width: 769px) {
            .pc-view { display: block !important; }
            .mobile-view { display: none !important; }
        }
    </style>
</head>
<body class="min-h-screen pb-32">

    <!-- ========================================== -->
    <!-- ANDROID / MOBILE VIEW (Designed for Phones) -->
    <!-- ========================================== -->
    <div class="mobile-view hidden flex-col p-3 w-full max-w-lg mx-auto gap-4">
        <!-- Mobile Header -->
        <header class="flex justify-between items-center border-b border-[#3c3836] pb-3">
            <div>
                <h1 class="text-base font-medium tracking-tight text-[#fbf1c7] flex items-center gap-2">
                    <span class="w-2.5 h-2.5 bg-[#d79921] rounded-full animate-pulse"></span>
                    Uni Koblenz // Inbox
                </h1>
                <p id="stats-counter-mobile" class="text-[11px] text-[#a89984] mt-0.5 mono">Loading...</p>
            </div>
            <div class="flex items-center gap-2 sans-ui">
                <button onclick="triggerSync()" class="bg-[#3c3836] active:bg-[#504945] text-[#ebdbb2] px-3 py-2 rounded-xl text-xs font-semibold border border-[#504945]">Sync</button>
                <button onclick="toggleSelectMode()" id="select-mode-btn-mobile" class="bg-[#3c3836] active:bg-[#504945] text-[#ebdbb2] px-3 py-2 rounded-xl text-xs font-semibold border border-[#504945]">Select</button>
            </div>
        </header>

        <!-- Mobile Controls: Search, Tabs, Tag Filter, Sorter -->
        <div class="flex flex-col gap-2.5 sans-ui">
            <input type="search" id="search-input-mobile" oninput="syncSearchAndRender('mobile')" placeholder="Ask naturally (e.g. exams tomorrow)..." class="w-full bg-[#1d2021] text-[#ebdbb2] border border-[#3c3836] px-4 py-3 rounded-2xl text-xs italic focus:outline-none focus:border-[#d79921]">
            
            <div class="flex gap-1 bg-[#282828] p-1 rounded-xl border border-[#3c3836] overflow-x-auto">
                <button onclick="setTab('active')" id="tab-active-mobile" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-[#d79921] text-[#1d2021] shrink-0">Active</button>
                <button onclick="setTab('upcoming')" id="tab-upcoming-mobile" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-[#a89984] shrink-0">Upcoming</button>
                <button onclick="setTab('done')" id="tab-done-mobile" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-[#a89984] shrink-0">Done</button>
                <button onclick="setTab('all')" id="tab-all-mobile" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-[#a89984] shrink-0">All</button>
            </div>

            <div class="flex items-center gap-2">
                <select id="tag-filter-mobile" onchange="syncTagAndRender('mobile')" class="bg-[#282828] text-[#ebdbb2] border border-[#3c3836] px-3 py-2.5 rounded-xl text-xs flex-1 focus:outline-none">
                    <option value="" selected>All Tags</option>
                </select>
                <select id="sort-selector-mobile" onchange="syncSortAndRender('mobile')" class="bg-[#282828] text-[#ebdbb2] border border-[#3c3836] px-3 py-2.5 rounded-xl text-xs flex-1 focus:outline-none">
                    <option value="relevance" selected>AI Relevance</option>
                    <option value="date-soonest">Date (Soonest)</option>
                    <option value="date-latest">Date (Latest)</option>
                    <option value="received-newest">Received (Newest)</option>
                    <option value="title">Title (A-Z)</option>
                </select>
            </div>
        </div>

        <div id="ai-answer-bar-mobile" class="hidden bg-[#23272e] border border-[#d79921]/30 px-4 py-2 rounded-xl text-xs sans-ui text-[#fabd2f] italic"></div>
        <div id="loading-mobile" class="text-center text-[#a89984] italic py-12 text-xs mono">Syncing records...</div>
        
        <!-- Mobile Feed Container -->
        <div id="events-list-mobile" class="flex flex-col gap-3"></div>
    </div>


    <!-- ========================================== -->
    <!-- PC / DESKTOP VIEW (Designed for Computers) -->
    <!-- ========================================== -->
    <div class="pc-view hidden p-6 md:p-8 max-w-[98%] mx-auto">
        <!-- PC Header -->
        <header class="flex justify-between items-center border-b border-[#3c3836] pb-6 mb-6">
            <div>
                <h1 class="text-2xl font-medium tracking-tight text-[#fbf1c7] flex items-center gap-3">
                    <span class="w-2.5 h-2.5 bg-[#d79921] rounded-full animate-pulse"></span>
                    Universität Koblenz // Posteingang
                </h1>
                <p id="stats-counter-pc" class="text-xs text-[#a89984] mt-1 mono font-medium">Loading records...</p>
            </div>
            <div class="flex items-center gap-3 sans-ui text-xs">
                <button onclick="triggerSync()" class="bg-[#3c3836] hover:bg-[#504945] text-[#ebdbb2] px-4 py-2.5 rounded-xl font-semibold tracking-wide transition border border-[#504945] shadow-md">Sync New Mails</button>
                <button onclick="clearAllEvents()" class="bg-[#cc241d]/20 hover:bg-[#cc241d]/40 text-[#fb4934] border border-[#cc241d]/30 px-3.5 py-2.5 rounded-xl font-semibold tracking-wide transition">Purge Database</button>
            </div>
        </header>

        <!-- PC Controls Bar -->
        <div class="flex flex-wrap justify-between items-center mb-6 gap-3 bg-[#282828]/90 p-4 rounded-2xl border border-[#3c3836] sans-ui text-xs">
            <div class="flex gap-1.5 bg-[#1d2021] p-1 rounded-xl border border-[#3c3836]">
                <button onclick="setTab('active')" id="tab-active-pc" class="px-4 py-2 rounded-lg font-semibold transition bg-[#d79921] text-[#1d2021] shadow">Active</button>
                <button onclick="setTab('all')" id="tab-all-pc" class="px-4 py-2 rounded-lg font-semibold transition text-[#a89984] hover:text-[#ebdbb2]">All</button>
                <button onclick="setTab('upcoming')" id="tab-upcoming-pc" class="px-4 py-2 rounded-lg font-semibold transition text-[#a89984] hover:text-[#ebdbb2]">Upcoming</button>
                <button onclick="setTab('past')" id="tab-past-pc" class="px-4 py-2 rounded-lg font-semibold transition text-[#a89984] hover:text-[#ebdbb2]">Passed</button>
                <button onclick="setTab('done')" id="tab-done-pc" class="px-4 py-2 rounded-lg font-semibold transition text-[#a89984] hover:text-[#ebdbb2]">Done</button>
            </div>

            <div class="flex-grow max-w-xs">
                <input type="search" id="search-input-pc" oninput="syncSearchAndRender('pc')" placeholder="Ask naturally (e.g. exams next week)..." class="w-full bg-[#1d2021] text-[#ebdbb2] border border-[#3c3836] px-4 py-2.5 rounded-xl text-xs italic focus:outline-none focus:border-[#d79921]">
            </div>

            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1.5">
                    <span class="text-[#a89984] font-semibold uppercase">Tag:</span>
                    <select id="tag-filter-pc" onchange="syncTagAndRender('pc')" class="px-3 py-2.5 rounded-xl font-medium focus:outline-none border border-[#3c3836]">
                        <option value="" selected>All Tags</option>
                    </select>
                </div>

                <button onclick="toggleSelectMode()" id="select-mode-btn-pc" class="bg-[#3c3836] hover:bg-[#504945] text-[#ebdbb2] px-3.5 py-2.5 rounded-xl font-semibold transition border border-[#504945]">Select: OFF</button>
                
                <div class="flex items-center gap-1.5">
                    <span class="text-[#a89984] font-semibold uppercase">Sort:</span>
                    <select id="sort-selector-pc" onchange="syncSortAndRender('pc')" class="px-3 py-2.5 rounded-xl font-medium focus:outline-none border border-[#3c3836]">
                        <option value="relevance" selected>AI Relevance</option>
                        <option value="date-soonest">Date (Soonest)</option>
                        <option value="date-latest">Date (Latest)</option>
                        <option value="received-newest">Received (Newest)</option>
                        <option value="title">Title (A-Z)</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="ai-answer-bar-pc" class="hidden mb-6 bg-[#23272e] border border-[#d79921]/30 px-5 py-3 rounded-xl text-xs sans-ui text-[#fabd2f] italic"></div>
        <div id="loading-pc" class="text-center text-[#a89984] italic py-16 text-sm mono">Synchronizing database...</div>
        
        <!-- PC Grid Container -->
        <div id="events-grid-pc" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
    </div>

    <!-- Floating Batch Action Toolbar -->
    <div id="batch-toolbar" class="hidden fixed bottom-6 left-4 right-4 max-w-md mx-auto bg-[#282828]/95 backdrop-blur border border-[#d79921]/50 px-5 py-3.5 rounded-2xl flex justify-between items-center text-xs sans-ui shadow-2xl z-50">
        <span id="selected-count" class="font-semibold text-[#fabd2f]">0 selected</span>
        <div class="flex gap-2">
            <button onclick="batchDelete()" class="bg-[#cc241d] text-white px-4 py-2 rounded-xl font-semibold transition">Delete Selected</button>
            <button onclick="toggleSelectMode()" class="bg-[#3c3836] text-[#ebdbb2] px-3 py-2 rounded-xl font-semibold transition">Cancel</button>
        </div>
    </div>

    <script>
        let allEvents = [];
        let currentTab = 'active';
        let selectMode = false;
        let selectedIds = new Set();
        let searchQuery = "";
        let selectedTag = "";
        let sortMode = "relevance";

        function setTab(tab) {
            currentTab = tab;
            ['active', 'all', 'upcoming', 'past', 'done'].forEach(t => {
                ['pc', 'mobile'].forEach(platform => {
                    const btn = document.getElementById(`tab-${t}-${platform}`);
                    if (btn) {
                        if (t === tab) {
                            btn.className = platform === 'mobile' 
                                ? "px-3 py-1.5 rounded-lg text-xs font-semibold bg-[#d79921] text-[#1d2021] shrink-0 shadow" 
                                : "px-4 py-2 rounded-lg font-semibold transition bg-[#d79921] text-[#1d2021] shadow";
                        } else {
                            btn.className = platform === 'mobile'
                                ? "px-3 py-1.5 rounded-lg text-xs font-semibold text-[#a89984] shrink-0"
                                : "px-4 py-2 rounded-lg font-semibold transition text-[#a89984] hover:text-[#ebdbb2]";
                        }
                    }
                });
            });
            renderEvents();
        }

        function toggleSelectMode() {
            selectMode = !selectMode;
            ['pc', 'mobile'].forEach(platform => {
                const btn = document.getElementById(`select-mode-btn-${platform}`);
                if (btn) {
                    btn.innerText = selectMode ? (platform === 'mobile' ? "Done" : "Select: ON") : (platform === 'mobile' ? "Select" : "Select: OFF");
                    if (selectMode) btn.classList.add("bg-[#d79921]", "text-[#1d2021]");
                    else btn.classList.remove("bg-[#d79921]", "text-[#1d2021]");
                }
            });
            if (!selectMode) {
                selectedIds.clear();
                document.getElementById('batch-toolbar').classList.add('hidden');
            }
            renderEvents();
        }

        function syncSearchAndRender(source) {
            searchQuery = document.getElementById(`search-input-${source}`).value.trim();
            const other = source === 'pc' ? 'mobile' : 'pc';
            document.getElementById(`search-input-${other}`).value = searchQuery;
            renderEvents();
        }

        function syncTagAndRender(source) {
            selectedTag = document.getElementById(`tag-filter-${source}`).value;
            const other = source === 'pc' ? 'mobile' : 'pc';
            document.getElementById(`tag-filter-${other}`).value = selectedTag;
            renderEvents();
        }

        function syncSortAndRender(source) {
            sortMode = document.getElementById(`sort-selector-${source}`).value;
            const other = source === 'pc' ? 'mobile' : 'pc';
            document.getElementById(`sort-selector-${other}`).value = sortMode;
            renderEvents();
        }

        function parseDate(dateStr) {
            if (!dateStr) return null;
            let rawDate = dateStr.split('-')[0].trim().split(' ')[0];
            let parts = rawDate.split('.');
            if (parts.length === 3) return new Date(parts[2], parts[1] - 1, parts[0]);
            return null;
        }

        function getDaysToGo(dateStr) {
            const eventDate = parseDate(dateStr);
            if (!eventDate) return { text: "", isPast: false, diffDays: null };
            let today = new Date();
            today.setHours(0, 0, 0, 0);
            let diffDays = Math.ceil((eventDate - today) / (1000 * 60 * 60 * 24));
            if (diffDays > 0) return { text: `<span class="bg-[#fabd2f]/15 text-[#fabd2f] border border-[#fabd2f]/30 px-2 py-0.5 rounded text-[10px] mono font-semibold">in ${diffDays}d</span>`, isPast: false, diffDays };
            if (diffDays === 0) return { text: `<span class="bg-[#fe8019]/20 text-[#fe8019] border border-[#fe8019]/40 px-2 py-0.5 rounded text-[10px] mono font-bold">Today</span>`, isPast: false, diffDays: 0 };
            return { text: `<span class="bg-[#3c3836] text-[#a89984] px-2 py-0.5 rounded text-[10px] mono">Passed</span>`, isPast: true, diffDays };
        }

        async function triggerSync() {
            try {
                await fetch('/sync', { method: 'POST' });
                alert("Background sync triggered.");
            } catch (e) { alert("Sync failed."); }
        }

        async function toggleDone(id, isDone) {
            const ev = allEvents.find(e => e.id === id);
            if (ev) ev.is_done = isDone;
            renderEvents();

            await fetch(`/events/${id}/done`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_done: isDone })
            });
        }

        async function togglePin(id, currentPinnedState) {
            const actionWord = currentPinnedState ? "pin" : "unpin";
            if (!confirm(`Are you sure you want to ${actionWord} this event?`)) return;

            const newPinnedState = !currentPinnedState;
            const ev = allEvents.find(e => e.id === id);
            if (ev) ev.is_pinned = newPinnedState;
            renderEvents();

            await fetch(`/events/${id}/pin`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_pinned: newPinnedState })
            });
        }

        async function addTag(id, currentTagsStr) {
            let tagInput = prompt("Enter tag name (e.g., done, important, exam):");
            if (!tagInput) return;
            let tags = [];
            try { tags = JSON.parse(currentTagsStr.replace(/'/g, '"')); } catch(e) { tags = []; }
            if (!tags.includes(tagInput)) tags.push(tagInput);

            let extraUpdates = {};
            if (tagInput.toLowerCase().startsWith("done:")) extraUpdates.is_done = true;

            await fetch(`/events/${id}/tags`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tags: tags, ...extraUpdates })
            });
            fetchEvents();
        }

        async function clearAllEvents() {
            if (!confirm("Wipe all records?")) return;
            await fetch('/events', { method: 'DELETE' });
            fetchEvents();
        }

        function toggleSelect(id, checkbox) {
            if (checkbox.checked) selectedIds.add(id);
            else selectedIds.delete(id);
            
            const toolbar = document.getElementById('batch-toolbar');
            if (selectedIds.size > 0) {
                toolbar.classList.remove('hidden');
                document.getElementById('selected-count').innerText = `${selectedIds.size} selected`;
            } else {
                toolbar.classList.add('hidden');
            }
        }

        async function batchDelete() {
            if (!confirm(`Delete ${selectedIds.size} records?`)) return;
            await fetch('/events/batch-delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ids: Array.from(selectedIds) })
            });
            selectedIds.clear();
            document.getElementById('batch-toolbar').classList.add('hidden');
            fetchEvents();
        }

        async function fetchEvents() {
            try {
                const response = await fetch('/events');
                const data = await response.json();
                ['pc', 'mobile'].forEach(p => {
                    const loader = document.getElementById(`loading-${p}`);
                    if (loader) loader.style.display = 'none';
                });
                allEvents = data.events || [];
                populateTagDropdowns();
                renderEvents();
            } catch (error) { console.error("Failed to load records."); }
        }

        function populateTagDropdowns() {
            let allTagsSet = new Set();
            allEvents.forEach(ev => {
                try {
                    let tags = JSON.parse((ev.tags || '[]').replace(/'/g, '"'));
                    tags.forEach(t => allTagsSet.add(t));
                } catch(e){}
            });

            ['pc', 'mobile'].forEach(platform => {
                const dropdown = document.getElementById(`tag-filter-${platform}`);
                if (!dropdown) return;
                dropdown.innerHTML = `<option value="">All Tags</option>`;
                Array.from(allTagsSet).sort().forEach(tag => {
                    let opt = document.createElement('option');
                    opt.value = tag;
                    opt.innerText = `#${tag}`;
                    if (tag === selectedTag) opt.selected = true;
                    dropdown.appendChild(opt);
                });
            });
        }

        function smartMatch(event, query) {
            const q = query.toLowerCase();
            const title = (event.event_title || "").toLowerCase();
            const summary = (event.summary || "").toLowerCase();
            const organizer = (event.organizer || "").toLowerCase();
            const category = (event.category || "").toLowerCase();
            
            let tags = [];
            try { tags = JSON.parse((event.tags || '[]').replace(/'/g, '"')); } catch(e){}
            const combinedText = `${title} ${summary} ${organizer} ${category} ${tags.join(" ").toLowerCase()}`;

            const info = getDaysToGo(event.date || event.deadline);
            if (q.includes("today") || q.includes("heute")) return info.diffDays === 0;
            if (q.includes("tomorrow") || q.includes("morgen")) return info.diffDays === 1;
            if (q.includes("this week") || q.includes("week")) return info.diffDays !== null && info.diffDays >= 0 && info.diffDays <= 7;
            if (q.includes("exam") || q.includes("prüfung")) return category.includes("exam") || combinedText.includes("exam") || combinedText.includes("prüfung");
            if (q.includes("deadline") || q.includes("frist")) return category.includes("deadline") || combinedText.includes("deadline") || combinedText.includes("frist");

            const tokens = q.split(/\s+/);
            return tokens.every(token => combinedText.includes(token));
        }

        function computeRelevanceScore(event, queryTokens) {
            let score = 0;
            const text = `${event.event_title} ${event.summary} ${event.organizer} ${event.category}`.toLowerCase();
            queryTokens.forEach(token => {
                if (text.includes(token)) score += 10;
            });
            return score;
        }

        function renderEvents() {
            let filtered = allEvents.filter(ev => {
                const info = getDaysToGo(ev.date || ev.deadline);
                if (selectedTag) {
                    try {
                        let evTags = JSON.parse((ev.tags || '[]').replace(/'/g, '"'));
                        if (!evTags.includes(selectedTag)) return false;
                    } catch(e) { return false; }
                }

                let hasDoneTag = false;
                try {
                    let evTags = JSON.parse((ev.tags || '[]').replace(/'/g, '"'));
                    hasDoneTag = evTags.some(t => t.toLowerCase().startsWith('done'));
                } catch(e){}

                let effectiveIsDone = hasDoneTag ? true : ev.is_done;

                if (currentTab === 'done') return effectiveIsDone;
                if (effectiveIsDone) return false;
                if (currentTab === 'active') return !info.isPast;
                if (currentTab === 'upcoming') return !info.isPast;
                if (currentTab === 'past') return info.isPast;
                return true;
            });

            if (searchQuery.length > 0) {
                filtered = filtered.filter(ev => smartMatch(ev, searchQuery));
            }

            // AI Bar update
            ['pc', 'mobile'].forEach(platform => {
                const aiBar = document.getElementById(`ai-answer-bar-${platform}`);
                if (aiBar) {
                    if (searchQuery.length > 0) {
                        aiBar.classList.remove('hidden');
                        aiBar.innerText = `Found ${filtered.length} matching event${filtered.length > 1 ? 's' : ''} for "${searchQuery}"`;
                    } else {
                        aiBar.classList.add('hidden');
                    }
                }
            });

            const uids = new Set(allEvents.map(e => e.email_uid).filter(Boolean));
            const statsText = `${filtered.length} tiles in "${currentTab.toUpperCase()}" // ${uids.size || allEvents.length} Mails Parsed`;
            document.getElementById('stats-counter-pc').innerText = statsText;
            document.getElementById('stats-counter-mobile').innerText = statsText;

            // Sorting
            filtered.sort((a, b) => {
                if (a.is_pinned !== b.is_pinned) return a.is_pinned ? -1 : 1;
                if (sortMode === 'title') return a.event_title.localeCompare(b.event_title);
                if (sortMode === 'received-newest') return new Date(b.created_at || 0) - new Date(a.created_at || 0);
                const dateA = parseDate(a.date || a.deadline) || new Date(8640000000000);
                const dateB = parseDate(b.date || b.deadline) || new Date(8640000000000);
                if (sortMode === 'date-soonest') return dateA - dateB;
                if (sortMode === 'date-latest') return dateB - dateA;
                return dateA - dateB;
            });

            renderContainer('pc', filtered);
            renderContainer('mobile', filtered);
        }

        function renderContainer(platform, filtered) {
            const container = document.getElementById(platform === 'pc' ? 'events-grid-pc' : 'events-list-mobile');
            if (!container) return;
            container.innerHTML = "";

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-[#a89984] italic py-16 text-center text-xs mono col-span-full">No matching records found.</p>`;
                return;
            }

            filtered.forEach(event => {
                let hasDoneTag = false;
                try {
                    let evTags = JSON.parse((event.tags || '[]').replace(/'/g, '"'));
                    hasDoneTag = evTags.some(t => t.toLowerCase().startsWith('done'));
                } catch(e){}
                let effectiveIsDone = hasDoneTag ? true : event.is_done;

                const card = document.createElement('div');
                card.className = `card rounded-2xl p-4 md:p-5 flex flex-col justify-between text-sm ${effectiveIsDone ? 'opacity-40' : ''} ${event.is_pinned ? 'pinned-card' : ''}`;

                let countdown = getDaysToGo(event.date || event.deadline);
                let actionBadge = (event.action_required && !countdown.isPast) ? `<span class="bg-[#cc241d]/20 text-[#fb4934] border border-[#cc241d]/40 px-2 py-0.5 rounded text-[10px] mono font-semibold">Action Required</span>` : "";
                
                let eventDateDisplay = "";
                if (event.date) {
                    eventDateDisplay = `<div class="bg-[#1d2021] border border-[#3c3836] rounded-xl p-2.5 mb-3 flex items-center justify-between"><span class="text-[10px] text-[#a89984] uppercase font-bold">Event Date</span><span class="text-[#ebdbb2] font-semibold mono text-xs">${event.date} ${countdown.text}</span></div>`;
                } else if (event.deadline) {
                    eventDateDisplay = `<div class="bg-[#cc241d]/15 border border-[#cc241d]/30 rounded-xl p-2.5 mb-3 flex items-center justify-between"><span class="text-[10px] text-[#fb4934] uppercase font-bold">Deadline</span><span class="text-[#fb4934] font-semibold mono text-xs">${event.deadline} ${countdown.text}</span></div>`;
                } else {
                    eventDateDisplay = `<div class="bg-[#1d2021]/50 border border-[#3c3836]/50 rounded-xl p-2.5 mb-3 flex items-center justify-between"><span class="text-[10px] text-[#7c6f64] uppercase font-bold">Date</span><span class="text-[#7c6f64] italic text-[11px]">Not specified</span></div>`;
                }

                let linkButton = event.email_link ? `<a href="${event.email_link}" target="_blank" class="inline-block text-xs font-semibold text-[#83a598] hover:text-[#bdae93] mt-2 sans-ui underline underline-offset-4">Open Broadcast Link</a>` : "";

                let parsedTags = [];
                try { parsedTags = JSON.parse((event.tags || '[]').replace(/'/g, '"')); } catch(e) { parsedTags = []; }
                let tagsHtml = parsedTags.map(t => `<span class="bg-[#1d2021] text-[#d5c4a1] px-2 py-0.5 rounded text-[10px] border border-[#3c3836] mono">#${t}</span>`).join(' ');

                let checkboxHtml = selectMode ? `<input type="checkbox" onclick="toggleSelect(${event.id}, this)" ${selectedIds.has(event.id) ? 'checked' : ''} class="w-5 h-5 rounded bg-[#1d2021] border-[#504945] text-[#d79921]">` : '';

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-3 sans-ui">
                            <div class="flex items-center gap-2">
                                ${checkboxHtml}
                                <span class="uppercase tracking-wider text-[10px] font-semibold text-[#bdae93] bg-[#d79921]/15 border border-[#d79921]/30 px-2 py-0.5 rounded">${event.category}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                ${actionBadge}
                                <button onclick="togglePin(${event.id}, ${event.is_pinned})" class="text-[11px] text-[#a89984] hover:text-[#fabd2f] font-bold px-2.5 py-1 rounded border border-[#3c3836] bg-[#1d2021] transition">${event.is_pinned ? '★ PINNED' : '☆ PIN'}</button>
                            </div>
                        </div>

                        <h2 class="text-base font-medium text-[#fbf1c7] mb-1.5 leading-snug italic">${event.event_title}</h2>
                        <p class="text-[11px] text-[#a89984] uppercase tracking-wide mb-3 truncate font-medium sans-ui">Sender: ${event.organizer || 'Unknown'}</p>
                        
                        ${eventDateDisplay}

                        <p class="text-[#d5c4a1] text-sm leading-relaxed mb-3 not-italic">${event.summary}</p>
                        ${linkButton}
                    </div>

                    <div class="mt-4 pt-3 border-t border-[#3c3836] flex flex-col gap-2.5 sans-ui">
                        <div class="flex flex-wrap items-center gap-1.5">
                            ${tagsHtml}
                            <button onclick="addTag(${event.id}, '${event.tags || '[]'}')" class="text-[10px] text-[#a89984] bg-[#1d2021] px-2 py-0.5 rounded border border-[#3c3836]">+Tag</button>
                        </div>
                        <div class="flex justify-between items-center pt-1">
                            <span class="mono text-[10px] text-[#a89984]">Received: ${event.email_date ? event.email_date.substring(0,16) : 'Unknown'}</span>
                            <label class="flex items-center gap-2 cursor-pointer font-bold text-sm text-[#ebdbb2] hover:text-white">
                                <input type="checkbox" ${effectiveIsDone ? 'checked' : ''} onchange="toggleDone(${event.id}, this.checked)" class="w-5 h-5 rounded bg-[#1d2021] border-[#504945] text-[#b8bb26]">
                                Done
                            </label>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        fetchEvents();
    </script>
</body>
</html>
